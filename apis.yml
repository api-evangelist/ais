apis:
  - aid: ais:ais-client-portal
    name: AIS Client Portal
    description: >-
      The AIS Client Portal is the secure area where financial advisors and
      individual investors reach AIS statements, performance reporting and
      account documents. Probed 2026-08-30: clients.aisgroup.com is a
      white-labeled Onehub workspace — every request lands on ws.onehub.com and
      its error pages are titled "404 - Onehub" — so it is a licensed
      third-party document-sharing product, not software AIS builds. It exposes
      no public API, no documentation host and no machine-readable contract;
      any API behind it belongs to Onehub and is out of scope for this profile.
    humanURL: https://clients.aisgroup.com
    tags:
