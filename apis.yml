description: >-
  AIS Group — trading as AIS Capital Management, L.P., where AIS stands for
  "Applied Intelligence Strategies" — is an investment management firm running
  absolute-return, global macro programs for financial advisors and individual
  investors. It combines discretionary macroeconomic and intermarket research
  (the Multi-Asset Allocation Portfolio family) with systematic, shorter-horizon
  models (the Frontera programs), trading only liquid instruments listed on major
  exchanges and describing its methodology as transparent rather than black-box.
  The firm is an investment manager rather than a software vendor: it publishes no
  public API, no developer program and no machine-readable contract, and its
  client portal is a licensed third-party workspace rather than software it
  operates.
